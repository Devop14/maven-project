name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/tf-modules/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/tf-modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment to plan
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - staging
          - production

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-check:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tf-modules
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  terraform-plan:
    name: Terraform plan (${{ inputs.environment || 'dev' }})
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: terraform-${{ github.event_name == 'pull_request' && 'dev' || inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: infra/tf-modules
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || inputs.environment || 'dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Initialize Terraform backend
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION is not configured"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is not configured"; exit 1; }
          state_key="${TF_STATE_KEY:-investment-platform/${TF_ENVIRONMENT}/terraform.tfstate}"
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${state_key}" \
            -backend-config="region=${AWS_REGION}"

      - name: Create Terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var-file="environments/${TF_ENVIRONMENT}/terraform.tfvars"
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.TF_ENVIRONMENT }}-${{ github.run_id }}
          path: |
            infra/tf-modules/tfplan
            infra/tf-modules/tfplan.txt
          if-no-files-found: error
          retention-days: 5